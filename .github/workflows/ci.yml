name: CI Pipeline
on:
    push:
      branches: [main]
    pull_request:
        branches: [main]
env:
    NODE_ENV: test
    APP_NAME: GH-200
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Show evn variables
              run: echo "App Name: ${APP_NAME}"
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: ${ { matrix.node-version } }
            - name: Run tests
              run: npm test